appId: ${APP_ID}
name: Loopback Start Stop
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible:
    id: home-screen
- repeat:
    times: 3
    commands:
      - tapOn:
          id: home-start-button
      - extendedWaitUntil:
          visible:
            id: home-stop-button
          timeout: 10000
      - tapOn:
          id: home-stop-button
      - extendedWaitUntil:
          visible:
            id: home-start-button
          timeout: 10000
